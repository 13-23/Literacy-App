# 안드로이드 출시 파일(.aab)과 테스트용 .apk를 만든다.
# main에 앱 코드가 바뀌어 올라오거나, Actions 탭에서 "Run workflow"를 누르거나, v1.0.1 같은 태그를 올리면 실행된다.
# 출시용 서명에 필요한 저장소 Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# (Secrets가 없으면 서명 안 된 .aab와 테스트용 .apk가 만들어진다)
name: Android build
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["src/**", "public/**", "android/**", "capacitor.config.json", "package*.json", ".github/workflows/android.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
