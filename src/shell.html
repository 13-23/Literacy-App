<title>어학 완전정복</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F3F4F8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Noto+Sans+JP:wght@400;600&family=Noto+Sans+SC:wght@400;600&display=swap">
<style>
/* Layout: phone-first app shell. Sticky top bar, one reading column, bottom tab bar on phones;
   answer choices drawn as OMR bubbles, the answer-sheet mark. */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#F7F8FB; --ink:#141A2E; --muted:#636A84; --line:#E4E7EF;
  --brand:#C42F5C; --brand-soft:#FCEBF0; --on-brand:#FFFFFF;
  --teal:#0F7C74; --teal-soft:#E0F2EF; --indigo:#4448B8; --indigo-soft:#ECECFB; --amber:#9A5B08; --amber-soft:#FBF0DD;
  --ok:#1A7F53; --ok-soft:#E3F4EB; --bad:#C0392B; --bad-soft:#FCEAE7;
  --shadow:0 1px 2px rgba(20,26,46,.05),0 6px 20px rgba(20,26,46,.06);
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-item:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F121A; --surface:#181C27; --surface-2:#1E2330; --ink:#E8EAF2; --muted:#9BA2B8; --line:#2A3040;
  --brand:#F06A93; --brand-soft:#3B1D29; --on-brand:#1A0B11;
  --teal:#4CC5B9; --teal-soft:#14302D; --indigo:#A3A6FF; --indigo-soft:#23254A; --amber:#F0B35A; --amber-soft:#382A14;
  --ok:#52C890; --ok-soft:#15301F; --bad:#F28275; --bad-soft:#3A1D1A; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F121A; --surface:#181C27; --surface-2:#1E2330; --ink:#E8EAF2; --muted:#9BA2B8; --line:#2A3040;
  --brand:#F06A93; --brand-soft:#3B1D29; --on-brand:#1A0B11;
  --teal:#4CC5B9; --teal-soft:#14302D; --indigo:#A3A6FF; --indigo-soft:#23254A; --amber:#F0B35A; --amber-soft:#382A14;
  --ok:#52C890; --ok-soft:#15301F; --bad:#F28275; --bad-soft:#3A1D1A; --shadow:none; color-scheme:dark}
/* 일본어·중국어 문제는 해당 언어 글꼴로 */
#app[lang="ja"]{--f-item:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
#app[lang="zh-CN"]{--f-item:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--safe-area-inset-top,env(safe-area-inset-top,0px));z-index:30;background:var(--bg)}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.gut{padding-left:max(16px,var(--safe-area-inset-left,env(safe-area-inset-left,0px)));padding-right:max(16px,var(--safe-area-inset-right,env(safe-area-inset-right,0px)))}
.col{max-width:720px;margin:0 auto}

/* top bar */
.topbar{position:sticky;top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .col{display:flex;align-items:center;gap:12px;height:56px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.01em;background:none;border:0;padding:0;cursor:pointer;white-space:nowrap}
.logo i{width:22px;height:22px;border-radius:50%;border:2px solid var(--brand);display:grid;place-items:center;flex:none}
.logo i::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--brand)}
.spacer{flex:1}
.tabs{display:flex;gap:4px}
.tab{display:flex;align-items:center;gap:6px;background:none;border:0;padding:8px 12px;border-radius:10px;color:var(--muted);font-size:14px;font-weight:500;cursor:pointer;position:relative;white-space:nowrap}
.tab[aria-current="true"]{color:var(--ink);background:var(--surface)}
.tab svg{width:20px;height:20px}
.tab .dot{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--brand);color:var(--on-brand);font-family:var(--f-num);font-size:11px;display:grid;place-items:center}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.iconbtn svg{width:18px;height:18px}

main{padding-block:20px 40px}
@media (max-width:639px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px max(16px,var(--safe-area-inset-right,env(safe-area-inset-right,0px))) calc(6px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))) max(16px,var(--safe-area-inset-left,env(safe-area-inset-left,0px)))}
  .tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px;flex:1;max-width:160px}
  .tab[aria-current="true"]{background:none;color:var(--brand)}
  .tab .dot{position:absolute;top:2px;left:calc(50% + 6px)}
  body.has-tabs main{padding-bottom:calc(96px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)))}
  body.in-quiz .tabs{display:none}
}
@media (min-width:640px){.tab svg{display:none}}

/* type */
h1{font-size:26px;line-height:1.25;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:17px;line-height:1.35;margin:0;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{font-family:var(--f-num);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.stack{display:grid;gap:12px}
.section{margin-top:32px;display:grid;gap:12px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.back{background:none;border:0;padding:0;color:var(--muted);font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;margin-bottom:10px}

/* home */
.hero{display:grid;gap:6px;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.stat b{display:block;font-family:var(--f-num);font-size:22px;font-weight:600;line-height:1.2}
.stat b small{font-size:13px;color:var(--muted);font-weight:500}
.stat span{font-size:12.5px;color:var(--muted)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,46,.12)}
.lvhint{font-size:12.5px;color:var(--muted)}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.badge{grid-row:1/span 3;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-num);font-weight:600;font-size:13px;line-height:1.1;text-align:center}
.b-g{background:var(--brand-soft);color:var(--brand)}
.b-v{background:var(--teal-soft);color:var(--teal)}
.b-r{background:var(--indigo-soft);color:var(--indigo)}
.b-m{background:var(--amber-soft);color:var(--amber)}
.b-6{background:var(--indigo-soft);color:var(--brand)}
.b-w{background:var(--teal-soft);color:var(--indigo)}
.weak{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.foot{margin-top:28px;text-align:center}
.foot a{color:inherit}
.mode .desc{font-size:13.5px;color:var(--muted);min-width:0}
.mode .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.mode .meta b{font-family:var(--f-num);color:var(--ink);font-weight:600}
.mode .go{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.exam{cursor:pointer;text-align:left;font:inherit;width:100%}
@media (hover:hover){.exam:hover{border-color:var(--brand)}}
.exam .badge{width:54px;height:54px;font-size:15px}
.chips{display:flex;gap:6px}
.chips button{font-family:var(--f-num);font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--surface-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14.5px;font-weight:600;padding:10px 18px;min-height:44px;border-radius:12px;border:1px solid var(--brand);background:var(--brand);color:var(--on-brand);cursor:pointer;text-decoration:none}
.btn.soft{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.btn.plain{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.recent{list-style:none;margin:0;padding:0}
.recent li{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.recent li:last-child{border-bottom:0}
.pct{font-family:var(--f-num);font-weight:600;min-width:3.2em;text-align:right}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;color:var(--muted);text-align:center;font-size:14px}

/* quiz */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qhead .title{flex:1;font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer{font-family:var(--f-num);font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.timer.over{color:var(--bad);border-color:var(--bad)}
.timer:empty{display:none}
.count{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.rdbtn{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap}
.rdbtn[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:20px}
.progress i{display:block;height:100%;background:var(--brand);border-radius:3px;transition:width .3s}
.passage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 18px 20px;margin-bottom:22px}
.ptype{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-num);font-size:11.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.passage h3{font-family:var(--f-item);font-size:19px;line-height:1.5;margin:0 0 10px;font-weight:600}
.passage.pdoc{margin-bottom:12px}.ptype.mset{margin:0 2px 8px}
.passage p{font-family:var(--f-item);font-size:16.5px;line-height:1.78;margin:0;white-space:pre-line}
#app[lang="ja"] .passage p,#app[lang="zh-CN"] .passage p{line-height:2.1}
ruby rt{font-family:var(--f-ui);font-size:.55em;color:var(--muted);font-weight:400}
body.rd-off ruby rt{display:none}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.tag.tcat{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.tag.tu{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.lv2{color:var(--teal)!important}.lv3{color:var(--amber)!important}.lv4{color:var(--bad)!important}
.stem{display:flex;gap:10px;margin:12px 0 18px}
.stem .qn{font-family:var(--f-num);color:var(--muted);padding-top:3px;flex:none;font-size:15px}
.stem p{font-family:var(--f-item);font-size:19px;line-height:1.6;margin:0;min-width:0}
#app[lang="ja"] .stem p,#app[lang="zh-CN"] .stem p{line-height:2}
.word{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:26px 18px;margin:12px 0 18px;text-align:center}
.word .w{font-family:var(--f-item);font-size:34px;font-weight:600;line-height:1.3;word-break:keep-all}
.word .wr{font-size:15px;color:var(--muted);margin-top:4px;min-height:1.5em}
.word .ask{font-size:13.5px;color:var(--muted);margin-top:12px}
.gap{display:inline-block;min-width:5.5em;border-bottom:2px solid currentColor;margin:0 .15em;height:1.1em;vertical-align:-.15em}
.gap.on{border-color:var(--brand);background:var(--brand-soft)}
.gap.num{min-width:3.2em;text-align:center;font-family:var(--f-num);font-size:12px;font-weight:600;line-height:1.1em;color:var(--muted)}
.gap.num.on{color:var(--brand)}
.ex{font-family:var(--f-item);font-size:16px}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;font-family:var(--f-item);font-size:17px;line-height:1.5;transition:border-color .15s,background .15s}
@media (hover:hover){.choice:hover:not(:disabled){border-color:var(--brand)}}
.choice:active:not(:disabled){transform:scale(.99)}
.choice:disabled{cursor:default}
.choice span:last-child{min-width:0}
.choice.ko{font-family:var(--f-ui);font-size:16px}
.bub{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--brand);color:var(--brand);display:grid;place-items:center;font-family:var(--f-num);font-size:13px;font-weight:600}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.right .bub{border-color:var(--ok);background:var(--ok);color:var(--surface)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .bub{border-color:var(--bad);background:var(--bad);color:var(--surface)}
.choice.dim{opacity:.55}
.fb{margin-top:18px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.fb .verdict{padding:12px 16px;font-weight:700;display:flex;align-items:center;gap:8px}
.fb .verdict.ok{background:var(--ok-soft);color:var(--ok)}
.fb .verdict.no{background:var(--bad-soft);color:var(--bad)}
.fb dl{margin:0;padding:14px 16px 16px;display:grid;gap:12px}
.fb dt{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin-bottom:2px}
.fb dd{margin:0;font-size:14.5px;line-height:1.7;white-space:pre-line}
.actionbar{position:sticky;bottom:0;z-index:10;margin-top:18px;padding:12px 0 calc(12px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.actionbar .inner{display:flex;align-items:center;gap:12px}
.kbd{font-family:var(--f-num);font-size:12px;color:var(--muted)}
@media (max-width:639px){.kbd{display:none}.actionbar .btn{flex:1}}

/* results */
.scorecard{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:108px;height:108px}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--brand);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring text{fill:var(--ink);font-family:var(--f-num);font-weight:600}
.cats{display:grid;gap:10px}
.cat{display:grid;grid-template-columns:7.5em 1fr 3.2em;gap:10px;align-items:center;font-size:14px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--ok)}
.bar i.mid{background:var(--amber)}.bar i.low{background:var(--bad)}
.review{list-style:none;margin:0;padding:0}
.review li{border-bottom:1px solid var(--line)}
.review li:last-child{border-bottom:0}
.review details{padding:12px 0}
.review summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;list-style:none}
.review summary::-webkit-details-marker{display:none}
.mark{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;align-self:flex-start;margin-top:2px}
.mark.ok{background:var(--ok-soft);color:var(--ok)}.mark.no{background:var(--bad-soft);color:var(--bad)}
.review .s{font-family:var(--f-item);font-size:15.5px;min-width:0;line-height:1.9}
.review .body{padding:10px 0 2px 32px;font-size:14px;display:grid;gap:6px;line-height:1.7}
.confirm{display:inline-flex;gap:8px;align-items:center;font-size:13px;flex-wrap:wrap}

/* 단어장 카드 */
.vcard{display:grid;gap:10px;justify-items:center;width:100%;min-height:340px;align-content:center;text-align:center;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:24px 18px;cursor:pointer;font:inherit;color:inherit;touch-action:pan-y}
.vcard.flipped{border-color:var(--brand)}
@media (hover:hover){.vcard:hover{border-color:var(--brand)}}
.vw{font-family:var(--f-item);font-size:40px;font-weight:600;line-height:1.25;word-break:keep-all}
.vcard.flipped .vw{font-size:26px}
.vr{font-size:16px;color:var(--muted);min-height:1.4em}
.vko{font-size:24px;font-weight:700;color:var(--brand);line-height:1.4}
.vex{font-family:var(--f-item);font-size:17px;line-height:2;max-width:32em;padding-top:12px;border-top:1px solid var(--line);width:100%}
.vexko{font-family:var(--f-ui);font-size:14.5px;color:var(--muted);line-height:1.6;margin-top:6px}
.vhint{font-size:12.5px;color:var(--muted)}
.vbtns{display:flex;gap:8px;align-items:center;margin-top:14px}
.vbtns .btn{flex:1}
.iconbtn:disabled{opacity:.35;cursor:default}
@media (max-width:420px){.vw{font-size:34px}}

/* CSV 문제 추가 */
.drop{display:grid;place-items:center;gap:8px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r);padding:26px 16px;background:var(--surface);cursor:pointer;color:var(--muted);font-size:14px}
.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop b{color:var(--ink);font-size:15px}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.sum div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
.sum b{font-family:var(--f-num);font-size:17px;display:block}
.errs{list-style:none;margin:0;padding:0;font-size:13.5px;display:grid;gap:6px;max-height:260px;overflow:auto}
.errs li{display:grid;grid-template-columns:auto 1fr;gap:8px}
.errs .ln{font-family:var(--f-num);font-size:12px;color:var(--muted);padding-top:2px}
.errs .e{color:var(--bad)}.errs .w{color:var(--amber)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-weight:600;white-space:nowrap}
.tbl td{color:var(--muted)}
.scroll{overflow-x:auto}
@media (max-width:420px){
  h1{font-size:23px}
  .stat b{font-size:19px}
  .stem p{font-size:18px}
  .word .w{font-size:30px}

<script>
/* ---------- 시험 설정 ---------- */
const KIND_LABEL={main:"주제·목적",fact:"사실 확인",blank:"빈칸 추론",detail:"세부 사항",infer:"추론",syn:"동의어",insert:"문장 위치",intent:"의도 파악",link:"연계 추론"};
const EXAMS={
  toeic:{name:"TOEIC",full:"TOEIC RC",lang:"en",eyebrow:"TOEIC Reading · Part 5 · 6 · 7",badge:"TOE<br>IC",bc:"b-g",
    levels:["2","3","4"],lvName:{2:"중상",3:"상",4:"최상"},minLv:true,
    filters:[["2","중상 이상"],["3","상 이상"],["4","최상만"]],
    modes:{W:["Part 5 어휘","P5<br>어휘","콜로케이션, 전치사로 고르는 어휘, 철자가 비슷한 혼동 어휘"],
           S:["Part 5 문법","P5<br>문법","도치, 가정법, 수 일치, 관계사, 준동사, 접속사와 전치사"],
           P6:["Part 6 장문 빈칸","P6<br>장문","이메일·공지·기사 속 빈칸 4개: 문맥 시제, 연결어, 어휘, 문장 넣기"],
           P:["Part 7 독해","P7<br>독해","단일 지문과 이중·삼중 지문: 주제, 사실 확인, 추론, 연계 추론, 문장 위치"],
           Q:["빈출 단어 퀴즈","단어","토익 빈출 동사·명사·형용사·부사. 뜻을 고르고 예문으로 확인"]},
    time:{W:20,S:20,P6:30,P:60,Q:10},pko:"지문 요지",desc:"Part 5 문법·어휘, Part 6 장문 빈칸, Part 7 독해, 빈출 단어"},
  jlpt:{name:"JLPT",full:"JLPT 일본어",lang:"ja",eyebrow:"日本語能力試験",badge:"日本<br>語",bc:"b-v",
    levels:["N5","N4","N3","N2","N1"],lvName:{},rd:"후리가나",
    modes:{W:["단어","単語","뜻, 한자 읽기, 한자 표기"],
           S:["문장","文法","조사, 문형, 경어, 접속 표현 빈칸"],
           P:["1문단 독해","読解","지문마다 주제, 내용 일치, 빈칸 3문항"],
           Q:["단어장 퀴즈","単語<br>帳","단어장 단어의 뜻 고르기. 예문과 해석으로 확인"]},
    time:{W:15,S:30,P:90,Q:10},pko:"지문 해석",desc:"단어·문법·1문단 독해·단어장"},
  hsk:{name:"HSK",full:"HSK 중국어",lang:"zh-CN",eyebrow:"汉语水平考试",badge:"汉<br>语",bc:"b-r",
    levels:["HSK1","HSK2","HSK3","HSK4","HSK5","HSK6"],lvName:{HSK1:"1급",HSK2:"2급",HSK3:"3급",HSK4:"4급",HSK5:"5급",HSK6:"6급"},rd:"병음",
    modes:{W:["단어","词语","뜻, 병음, 한자 고르기"],
           S:["문장","语法","양사, 개사, 보어, 把·被 구문 빈칸"],
           P:["1문단 독해","阅读","지문마다 주제, 내용 일치, 빈칸 3문항"],
           Q:["단어장 퀴즈","词汇","단어장 단어의 뜻 고르기. 예문과 해석으로 확인"]},
    time:{W:15,S:30,P:90,Q:10},pko:"지문 해석",desc:"단어·어법·1문단 독해·단어장"}
};
const EXAM_KEYS=Object.keys(EXAMS);
const ASK={"뜻":"뜻으로 알맞은 것을 고르세요","읽기":"읽는 법으로 알맞은 것을 고르세요","표기":"한자로 알맞은 것을 고르세요","병음":"병음으로 알맞은 것을 고르세요","한자":"이 뜻의 중국어 단어를 고르세요"};
const HIDE_RD=new Set(["읽기","표기","병음"]); /* 읽기 자체를 묻는 문제는 답이 보이지 않게 */
const modeLabel=(e,m)=>m==="MIX"?"실전 믹스":m==="WRONG"?"오답 다시 풀기":m==="CAT"?"약한 유형 집중":(EXAMS[e].modes[m]||[m])[0];
const isSet=k=>k==="P"||k==="P6"; /* 지문 하나에 문항 여러 개 */
const lvName=(e,lv)=>EXAMS[e].lvName[lv]||lv;

/* ---------- 문제 은행: 정답은 항상 첫 번째 선택지, 출제할 때 섞는다 ---------- */
const BANK={},PASS={};
function putItem(o){BANK[o.id]=o}
function putPassage(p){PASS[p.id]=p;p.qs.forEach((r,i)=>putItem({id:p.id+"-"+i,exam:p.exam,kind:"P",cat:r.cat||KIND_LABEL[r[0]]||"독해",qk:r[0],lv:p.lv,q:r[1],c:r[2],ex:r[3],p,u:p.u}))}
V.forEach(r=>putItem({id:r[0],exam:"toeic",kind:"W",cat:r[1],lv:String(r[2]),q:r[3],c:r[4],ko:r[5],ex:r[6]}));
G.forEach(r=>putItem({id:r[0],exam:"toeic",kind:"S",cat:r[1],lv:String(r[2]),q:r[3],c:r[4],ko:r[5],ex:r[6]}));
R.forEach(p=>putPassage(Object.assign({},p,{exam:"toeic",lv:String(p.lv)})));
/* Part 6: 지문마다 빈칸 {1}~{4} */
const P6PASS={};
P6.forEach(p=>{p.exam="toeic";p.lv=String(p.lv);P6PASS[p.id]=p;p.qs.forEach((r,i)=>putItem({id:p.id+"-"+i,exam:"toeic",kind:"P6",cat:r[0],lv:String(p.lv),q:"빈칸 ("+(i+1)+")",bi:i+1,c:r[1],ex:r[2],p}))});
function loadPack(exam,d){
  (d.words||[]).forEach(r=>putItem({id:r[0],exam,kind:"W",lv:r[1],cat:r[2],q:r[3],rd:r[4],c:r[5],ko:r[6],ex:r[7]}));
  (d.sentences||[]).forEach(r=>putItem({id:r[0],exam,kind:"S",lv:r[1],cat:r[2],q:r[3],c:r[4],ko:r[5],ex:r[6]}));
  (d.passages||[]).forEach(p=>putPassage(Object.assign({},p,{exam})));
}
PACKS.forEach(([exam,d])=>loadPack(exam,d));
/* 단어장 퀴즈: 단어장의 단어마다 뜻 고르기 1문항. 오답 보기는 같은 시험·급수·품사의 다른 뜻에서 고정으로 고른다(다시 풀어도 같은 문제). */
/* 뜻 비교: 괄호 설명과 흔한 어미를 빼고 두 글자씩 잘라, 하나라도 같으면 뜻이 겹친다고 본다 */
const STOP=new Set(["하다","되다","이다","있다","없다","스럽","롭다","하게","해서","하는","적인","적이"]);
const senses=ko=>{const b=new Set();String(ko).replace(/\([^)]*\)/g,"").split(/[,;]/).forEach(x=>{x=x.replace(/[^가-힣]/g,"");if(x.length===1)b.add(x);for(let i=0;i<x.length-1;i++){const t=x.slice(i,i+2);if(!STOP.has(t))b.add(t)}});return [...b]};
(()=>{const grp={};VOCAB.forEach(([e,list])=>list.forEach(v=>{const k=e+"|"+v.lv+"|"+v.pos;(grp[k]=grp[k]||[]).push(v);(grp[e+"|"+v.lv]=grp[e+"|"+v.lv]||[]).push(v)}));
  VOCAB.forEach(([e,list])=>list.forEach(v=>{
    if(BANK[v.id])return;
    const d=[],mine=new Set(senses(v.ko));
    /* 뜻이 일부라도 겹치는 단어(예: 简单 '간단하다, 쉽다'와 '쉽다')는 오답 보기로 쓰지 않는다 */
    const clash=ko=>senses(ko).some(x=>mine.has(x))||d.some(x=>senses(x).some(y=>senses(ko).includes(y)));
    const tryFrom=g=>{const i=Math.max(0,g.indexOf(v)),n=g.length;
      for(const step of [7,1])for(let k=1;k<=n&&d.length<3;k++){const o=g[(i+k*step)%n];if(o!==v&&o.w!==v.w&&!clash(o.ko))d.push(o.ko)}};
    /* 같은 품사에서 먼저 고르고, 모자라면 같은 급수 전체에서 */
    tryFrom(grp[e+"|"+v.lv+"|"+v.pos]);if(d.length<3)tryFrom(grp[e+"|"+v.lv]);
    if(d.length===3)putItem({id:v.id,exam:e,kind:"Q",cat:v.pos,lv:String(v.lv),q:v.w,rd:v.rd,c:[v.ko,...d],wex:v.ex,wko:v.exko});
  }))})();

/* ---------- 저장 (이 브라우저에만) ---------- */
const KEY="lang-quiz-v1",CKEY="lang-quiz-custom-v1";
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.h)return s}catch(e){}
  const s={h:{},s:[],lv:{}};
  /* 예전 TOEIC 앱 기록이 있으면 가져온다 */
  try{const o=JSON.parse(localStorage.getItem("toeic-rc-v1"));if(o&&o.h){s.h=o.h;s.s=(o.s||[]).map(r=>({e:"toeic",m:{G:"S",V:"W",R:"P",W:"Q"}[r.m]||r.m,lab:r.lab,ok:r.ok,n:r.n,d:r.d}));if(o.lv)s.lv.toeic=String(o.lv);s.cur="toeic"}}catch(e){}
  return s;
}
let store=load();
store.lv=store.lv||{};store.rd=store.rd||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
let custom={sets:[]};
try{const c=JSON.parse(localStorage.getItem(CKEY));if(c&&c.sets)custom=c}catch(e){}
function saveCustom(){try{localStorage.setItem(CKEY,JSON.stringify(custom));return true}catch(e){return false}}
function ingestSet(set){set.items.forEach(o=>putItem(Object.assign({u:set.id},o)));set.passages.forEach(p=>putPassage(Object.assign({u:set.id},p)))}
custom.sets.forEach(ingestSet);
function dropSet(id){Object.keys(BANK).forEach(k=>{if(BANK[k].u===id)delete BANK[k]});Object.keys(PASS).forEach(k=>{if(PASS[k].u===id)delete PASS[k]})}

const idsOf=e=>Object.keys(BANK).filter(id=>BANK[id].exam===e);
function stat(ids){let seen=0,n=0,c=0;ids.forEach(id=>{const h=store.h[id];if(h){seen++;n+=h.n;c+=h.c}});return {seen,total:ids.length,acc:n?Math.round(c/n*100):null}}
function wrongIds(e){return Object.keys(store.h).filter(id=>BANK[id]&&store.h[id].last===0&&(!e||BANK[id].exam===e))}

/* ---------- 테마: 기본은 라이트 ---------- */
const THEME_KEY="toeic-rc-theme";
let theme="light";try{theme=localStorage.getItem(THEME_KEY)||"light"}catch(e){}
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
function applyTheme(){
  document.documentElement.setAttribute("data-theme",theme);
  const b=document.getElementById("theme-btn");
  b.innerHTML=theme==="dark"?SUN:MOON;
  b.setAttribute("aria-label",theme==="dark"?"라이트 모드로 바꾸기":"다크 모드로 바꾸기");
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=theme==="dark"?"#0F121A":"#F3F4F8";
}

/* ---------- 난이도·급수 필터 ---------- */
const presentLv=e=>{const s=new Set(Object.values(BANK).filter(q=>q.exam===e).map(q=>q.lv));return EXAMS[e].levels.filter(l=>s.has(l))};
function filters(e){const X=EXAMS[e];return X.filters||[["all","전체"],...presentLv(e).map(l=>[l,lvName(e,l)])]}
function curLv(e){const f=filters(e),v=store.lv[e];return f.some(x=>x[0]===v)?v:f[0][0]}
function lvOk(e,lv){const v=curLv(e);if(EXAMS[e].minLv)return +lv>=+v;return v==="all"||lv===v}

/* ---------- 출제 ---------- */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const tries=id=>(store.h[id]?store.h[id].n:0);
/* 단어장(TOEIC은 난이도 구분 없음)은 TOEIC 난이도 필터를 적용하지 않는다 */
const vlvOk=(e,lv)=>!!EXAMS[e].minLv||lvOk(e,lv);
const pool=(e,k)=>Object.values(BANK).filter(q=>q.exam===e&&q.kind===k&&!isSet(k)&&(k==="Q"?vlvOk(e,q.lv):lvOk(e,q.lv))).map(q=>q.id);
const poolP=(e,k="P")=>Object.values(k==="P6"?P6PASS:PASS).filter(p=>p.exam===e&&lvOk(e,p.lv));
const pIds=p=>p.qs.map((_,i)=>p.id+"-"+i);
function pickLeast(ids,n){return ids.map(id=>[id,tries(id)+Math.random()*.9]).sort((a,b)=>a[1]-b[1]).slice(0,n).map(x=>x[0])}
function pickPassages(e,n,k="P"){return poolP(e,k).map(p=>[p,pIds(p).reduce((s,id)=>s+tries(id),0)/p.qs.length+Math.random()*.9]).sort((a,b)=>a[1]-b[1]).slice(0,n).map(x=>x[0])}
const size={W:10,S:10,P:2,P6:1,Q:10};

function build(e,mode,opt){
  let ids=[];
  if(mode==="W"||mode==="S"||mode==="Q")ids=pickLeast(pool(e,mode),size[mode]);
  if(mode==="P"||mode==="P6")pickPassages(e,size[mode],mode).forEach(p=>ids.push(...pIds(p)));
  if(mode==="CAT")ids=pickLeast(pool(e,opt.k).filter(id=>BANK[id].cat===opt.c),10);
  if(mode==="MIX"){
    if(e==="toeic"){ /* 실제 시험 순서: Part 5 → Part 6 → Part 7 */
      ids=shuffle([...pickLeast(pool(e,"S"),4),...pickLeast(pool(e,"W"),4)]);
      const q=pickPassages(e,1,"P6")[0];if(q)ids.push(...pIds(q));
    }else ids=shuffle([...pickLeast(pool(e,"W"),5),...pickLeast(pool(e,"S"),5)]);
    const p=pickPassages(e,1)[0];if(p)ids.push(...pIds(p));
  }
  if(mode==="WRONG"){
    const w=wrongIds(e);
    ids=shuffle(w.filter(id=>!isSet(BANK[id].kind)));
    [...new Set(w.filter(id=>isSet(BANK[id].kind)).map(id=>BANK[id].p.id))].forEach(pid=>ids.push(...w.filter(id=>BANK[id].p&&BANK[id].p.id===pid).sort((a,b)=>+a.split("-").pop()-+b.split("-").pop())));
  }
  return ids.map(id=>({id,order:shuffle(BANK[id].c.map((_,i)=>i))}));
}

/* ---------- 상태 ---------- */
let view="exams",cur=store.cur&&EXAMS[store.cur]?store.cur:"toeic",sess=null,timer=null,confirmReset=false,csv=null,confirmDel=null;
const app=document.getElementById("app");
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
/* 한자{읽기} 또는 [기준]{읽기} 를 루비로 */
const RUBY=/\[([^\]{}]+)\]\{([^}]+)\}|([㐀-䶿一-鿿豈-﫿々〆ヶ]+)\{([^}]+)\}/g;
const rb=s=>esc(s).replace(RUBY,(m,a,b,c,d)=>`<ruby>${a||c}<rt>${b||d}</rt></ruby>`);
const plain=s=>String(s==null?"":s).replace(RUBY,(m,a,b,c)=>a||c);
const BLANK="-------";
const blankify=(s,on)=>rb(s).split(BLANK).join(`<span class="gap${on?" on":""}" aria-label="빈칸"></span>`); /* 虽然……但是처럼 빈칸이 둘인 문장도 */
const isWordCard=q=>q.kind==="Q"||q.kind==="W"&&!String(q.q).includes(BLANK);
/* Part 6 지문: {1}~{4} 자리에 문항 번호를 넣은 빈칸 */
const p6text=(p,base,on)=>esc(p.text).replace(/\{(\d)\}/g,(m,d)=>`<span class="gap num${+d===on?" on":""}" aria-label="빈칸 ${base+ +d-1}">${base+ +d-1}</span>`);
const p6sentence=q=>q.p.text.split(/(\{\d\})/).map(t=>t==="{"+q.bi+"}"?"[ ? ]":/^\{\d\}$/.test(t)?"___":t).join("").split(/(?<=[.!?])\s+/).find(x=>x.includes("[ ? ]"))||"";
const isKo=s=>/[가-힣]/.test(s)&&!/[぀-ヿ一-鿿]/.test(s);
const L="ABCDEF";
const lvTag=q=>q.kind==="Q"&&EXAMS[q.exam].minLv?"":`<span class="tag ${q.exam==="toeic"?"lv"+q.lv:""}">${esc(lvName(q.exam,q.lv))}</span>`;
const rdOn=e=>store.rd[e]!==false;

function goExam(e){cur=e;store.cur=e;save();view="home";confirmReset=false;render();window.scrollTo(0,0)}
function start(e,mode,opt){
  const items=build(e,mode,opt);if(!items.length)return;
  const label=mode==="CAT"?opt.c+" 집중":modeLabel(e,mode);
  cur=e;sess={exam:e,mode,opt,label,items,i:0,res:[],picked:null,t0:Date.now()};
  view="quiz";render();window.scrollTo(0,0);
}
function choose(k){
  if(!sess||sess.picked!==null)return;
  const it=sess.items[sess.i];if(k>=it.order.length)return;
  const real=it.order[k],ok=real===0;
  sess.picked=k;
  sess.res.push({id:it.id,ok,pick:real,ms:Date.now()-sess.t0});
  const h=store.h[it.id]||{n:0,c:0,last:0};h.n++;if(ok)h.c++;h.last=ok?1:0;store.h[it.id]=h;save();
  stopTimer();render();
  const fb=document.getElementById("fb");
  if(fb)fb.scrollIntoView({block:"nearest",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});
}
function next(){
  if(!sess||sess.picked===null)return;
  if(sess.i<sess.items.length-1){
    const prevP=BANK[sess.items[sess.i].id].p;
    sess.i++;sess.picked=null;sess.t0=Date.now();render();
    const curP=BANK[sess.items[sess.i].id].p;
    if(!curP||curP!==prevP)window.scrollTo(0,0);
    else{const st=document.getElementById("stem");if(st)st.scrollIntoView({block:"start"})}
  }else{

function parseCSV(text){
  text=text.replace(/^﻿/,"");
  const first=text.split(/\r?\n/,1)[0]||"",delim=(first.match(/\t/g)||[]).length>(first.match(/,/g)||[]).length?"\t":",";
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"'&&f==="")q=true;
    else if(ch===delim){row.push(f);f=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}
    else f+=ch}
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}
function decode(buf){
  const b=new Uint8Array(buf);
  if(b[0]===0xFF&&b[1]===0xFE)return new TextDecoder("utf-16le").decode(buf);
  try{return new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){}
  try{return new TextDecoder("euc-kr").decode(buf)}catch(e){return new TextDecoder("utf-8").decode(buf)}
}

function normExam(v){v=v.trim().toLowerCase();if(/toeic|토익/.test(v))return "toeic";if(/jlpt|일본|jp|japan/.test(v))return "jlpt";if(/hsk|중국|cn|china/.test(v))return "hsk";return null}
function normKind(v){v=v.trim().toLowerCase();if(/^(단어|어휘|word|w|vocab)/.test(v))return "W";if(/^(문장|문법|sentence|s|grammar)/.test(v))return "S";if(/^(문단|독해|지문|reading|passage|p)/.test(v))return "P";return null}
function normLevel(e,v){v=v.trim().toUpperCase().replace(/\s/g,"");
  if(e==="toeic"){if(!v)return "2";const m={"중상":"2","상":"3","최상":"4","2":"2","3":"3","4":"4"};return m[v]||null}
  if(e==="jlpt"){const m=v.match(/^N?([1-5])(급)?$/);return m?"N"+m[1]:null}
  if(e==="hsk"){const m=v.match(/^(HSK)?([1-6])(급)?$/);return m?"HSK"+m[2]:null}
}
function normQK(v){v=v.trim().toLowerCase();if(/주제|목적|main/.test(v))return "main";if(/빈칸|blank/.test(v))return "blank";return "fact"}
const normBlank=s=>s.replace(/_{3,}|-{3,}|（\s*）|\(\s{0,3}\)|\[\s*\]/,BLANK);
function analyze(name,text){
  const rows=parseCSV(text),msgs=[];
  if(rows.length<2)return {name,items:[],passages:[],msgs:[{ln:1,t:"e",m:"제목 줄과 문제 줄이 있어야 해요."}],rows:0};
  const head=rows[0].map(h=>h.trim().toLowerCase()),col={};
  Object.entries(COLS).forEach(([k,names])=>{const i=head.findIndex(h=>names.some(n=>n.toLowerCase()===h));if(i>=0)col[k]=i});
  const miss=["exam","kind","q","c1"].filter(k=>col[k]==null).map(k=>COLS[k][0]);
  if(miss.length)return {name,items:[],passages:[],msgs:[{ln:1,t:"e",m:`필요한 칸이 없어요: ${miss.join(", ")}. 양식 파일의 제목 줄을 그대로 써 주세요.`}],rows:rows.length-1};
  const get=(r,k)=>col[k]==null?"":String(r[col[k]]||"").trim();
  const items=[],pass={},seen=new Set();
  const wordPool=e=>[...Object.values(BANK).filter(q=>q.exam===e&&q.kind==="W"&&isWordCard(q)).map(q=>({cat:q.cat,a:q.c[0]})),...items.filter(q=>q.exam===e&&isWordCard(q)).map(q=>({cat:q.cat,a:q.c[0]}))];
  const pend=[];
  rows.slice(1).forEach((r,ri)=>{
    const ln=ri+2,err=m=>msgs.push({ln,t:"e",m}),warn=m=>msgs.push({ln,t:"w",m});
    const e=normExam(get(r,"exam"));if(!e)return err(`시험 칸 "${get(r,"exam")}"을 모르겠어요. TOEIC, JLPT, HSK 중 하나로 써 주세요.`);
    const k=normKind(get(r,"kind"));if(!k)return err(`종류 칸 "${get(r,"kind")}"을 모르겠어요. 단어, 문장, 문단 중 하나로 써 주세요.`);
    const lv=normLevel(e,get(r,"level"));if(!lv)return err(`급수 칸 "${get(r,"level")}"이 ${e==="jlpt"?"N1~N5":e==="hsk"?"HSK1~HSK6(또는 1~6)":"중상·상·최상"} 형식이 아니에요.`);
    let q=get(r,"q");if(!q)return err("문제 칸이 비어 있어요.");
    const c=["c1","c2","c3","c4"].map(x=>get(r,x)).filter(Boolean);
    if(new Set(c).size!==c.length)return err("보기 중에 똑같은 것이 있어요.");
    const cat=get(r,"cat")||(k==="W"?"뜻":k==="S"?"문장":"독해"),ko=get(r,"ko"),ex=get(r,"ex");
    if(k==="S"){q=normBlank(q);if(!q.includes(BLANK))warn("빈칸 표시(___)가 없어요. 문장 그대로 보여 줄게요.")}
    const id="u-"+hash([e,k,q,c[0]].join("|"));
    if(BANK[id]||seen.has(id))return warn("이미 있는 문제라 건너뛰었어요.");
    if(k==="P"){
      const pid=get(r,"pid");if(!pid)return err("문단 문제는 지문번호 칸이 필요해요.");
      if(c.length<2)return err("보기가 2개 이상 있어야 해요.");
      const key=e+"|"+pid,P=pass[key]=pass[key]||{exam:e,lv,pid,qs:[],ln};
      if(get(r,"ptext")){P.text=normBlank(get(r,"ptext"));P.title=get(r,"ptitle");P.ko=get(r,"pko");P.type=get(r,"ptype")}
      const qk=normQK(cat);P.qs.push(Object.assign([qk,q,c,ex],{cat:get(r,"cat")||KIND_LABEL[qk]}));seen.add(id);return;
    }
    if(!ex)warn("해설이 비어 있어요.");
    seen.add(id);
    const o={id,exam:e,kind:k,lv,cat,q,rd:get(r,"rd"),c,ko,ex};
    if(c.length<2){if(k==="W"&&!q.includes(BLANK)){pend.push([o,ln]);items.push(o)}else err("보기가 2개 이상 있어야 해요.");return}
    items.push(o);
  });
  /* 보기1만 있는 단어는 같은 시험의 다른 단어 뜻으로 오답을 채운다 */
  pend.forEach(([o,ln])=>{
    const others=shuffle([...new Set(wordPool(o.exam).filter(x=>x.cat===o.cat&&x.a!==o.c[0]).map(x=>x.a))]).slice(0,3);
    if(others.length<3){items.splice(items.indexOf(o),1);msgs.push({ln,t:"e",m:"보기가 1개뿐인데 오답으로 쓸 같은 유형 단어가 부족해요. 보기2~4를 채워 주세요."})}
    else{o.c=[o.c[0],...others];msgs.push({ln,t:"w",m:"보기2~4를 다른 단어 뜻으로 자동으로 채웠어요."})}
  });
  const passages=[];
  Object.values(pass).forEach(P=>{
    if(!P.text){msgs.push({ln:P.ln,t:"e",m:`지문번호 ${P.pid}: 지문 칸이 채워진 줄이 없어요. 첫 문항 줄에 지문을 넣어 주세요.`});return}
    passages.push({id:"u-"+hash(P.exam+"|"+P.text),exam:P.exam,lv:P.lv,type:P.type,title:P.title,text:P.text,ko:P.ko,qs:P.qs});
  });
  msgs.sort((a,b)=>a.ln-b.ln);
  return {name,items,passages,msgs,rows:rows.length-1};
}

  const ids=vocIds(e);if(!Object.values(VOC).some(v=>v.exam===e))return "";
  const known=ids.filter(id=>store.vk[id]===1).length,rev=ids.filter(id=>store.vk[id]===2).length;
  return `<div class="section"><h2>단어장</h2><div class="mode"><div class="badge b-m">単<br>語</div><h2>단어 카드</h2>
    <div class="desc">앞면에 단어와 예문, 누르면 한국어 뜻이 나와요</div>
    <div class="meta"><span>단어 <b>${ids.length}</b></span><span>외운 단어 <b>${known}</b></span><span>다시 볼 단어 <b>${rev}</b></span></div>
    <div class="go"><span class="small muted">${X_lvText(e)}</span><button class="btn" data-act="vocab" ${ids.length?"":"disabled"}>카드 보기</button></div></div></div>`;
}
const X_lvText=e=>{if(EXAMS[e].minLv)return "난이도 구분 없이 전체";const v=curLv(e),f=filters(e).find(x=>x[0]===v);return f?(EXAMS[e].minLv?"난이도 ":"급수 ")+f[1]:""};
function vocabList(){
  let ids=vocIds(cur);
  if(vs.f==="new")ids=ids.filter(id=>store.vk[id]!==1);
  if(vs.f==="rev")ids=ids.filter(id=>store.vk[id]===2);
  return vs.mix?shuffle(ids):ids;
}
function openVocab(f){vs={f:f||(vs&&vs.f)||"new",mix:vs?vs.mix:false,i:0,flip:false,seen:0};vs.ids=vocabList();view="vocab";render();window.scrollTo(0,0)}
function vocabMark(k){const id=vs.ids[vs.i];if(!id)return;store.vk[id]=k;save();vocabMove(1)}
function vocabMove(d){vs.i=Math.max(0,Math.min(vs.ids.length,vs.i+d));vs.flip=false;render()}
function vocabView(){
  const X=EXAMS[cur],all=vocIds(cur),n=vs.ids.length;
  const cnt={all:all.length,new:all.filter(id=>store.vk[id]!==1).length,rev:all.filter(id=>store.vk[id]===2).length};
  const fb=(k,l)=>`<button data-act="vfilter" data-v="${k}" aria-pressed="${vs.f===k}">${l} ${cnt[k]}</button>`;
  let h=`<div class="qhead"><button class="iconbtn" data-act="home" aria-label="단어장 닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <span class="title">${X.name} · 단어장</span>
    ${X.rd?`<button class="rdbtn" data-act="rd" aria-pressed="${rdOn(cur)}">${X.rd}</button>`:""}
    <span class="count">${Math.min(vs.i+1,n)}/${n}</span></div>
  <div class="seg" role="group" aria-label="보기" style="margin-bottom:10px">${fb("new","안 외운")}${fb("rev","다시 볼")}${fb("all","전체")}</div>
  <div class="row" style="justify-content:space-between;margin-bottom:12px"><span class="small muted">${esc(X_lvText(cur))}</span><button class="rdbtn" data-act="vmix" aria-pressed="${vs.mix}">순서 섞기</button></div>
  <div class="progress"><i style="width:${n?vs.i/n*100:0}%"></i></div>`;
  if(!n)return h+`<div class="empty">${vs.f==="rev"?"다시 볼 단어가 없어요. 카드에서 \"다시 볼래요\"를 누르면 여기에 모여요.":"이 급수의 단어를 모두 외웠어요."}<div style="margin-top:14px"><button class="btn plain" data-act="vfilter" data-v="all">전체 단어 보기</button></div></div>`;
  if(vs.i>=n){const k=vs.ids.filter(id=>store.vk[id]===1).length,r=vs.ids.filter(id=>store.vk[id]===2).length;
    return h+`<div class="panel stack" style="text-align:center"><h2>${n}개를 다 봤어요</h2><div class="muted">외웠어요 ${k} · 다시 볼래요 ${r}</div>
      <div class="row" style="justify-content:center">${r?`<button class="btn" data-act="vfilter" data-v="rev">다시 볼 단어 ${r}개</button>`:""}<button class="btn plain" data-act="vrestart">처음부터</button><button class="btn plain" data-act="home">닫기</button></div></div>`}
  const v=VOC[vs.ids[vs.i]],st=store.vk[v.id];
  const tags=`<div class="tags" style="justify-content:center"><span class="tag tcat">${esc(v.pos)}</span><span class="tag">${esc(lvName(cur,v.lv))}</span>${st===1?`<span class="tag" style="color:var(--ok)">외웠어요</span>`:st===2?`<span class="tag tu">다시 볼래요</span>`:""}</div>`;
  h+=`<button class="vcard${vs.flip?" flipped":""}" id="vcard" data-act="vflip" aria-label="${vs.flip?"앞면 보기":"뜻 보기"}">${tags}
    <div class="vw">${esc(v.w)}</div><div class="vr">${v.rd&&(rdOn(cur)||vs.flip)?esc(v.rd):""}</div>
    ${vs.flip?`<div class="vko">${esc(v.ko)}</div>`:""}
    <div class="vex">${rb(v.ex)}${vs.flip?`<div class="vexko">${esc(v.exko)}</div>`:""}</div>
    ${vs.flip?"":`<div class="vhint">눌러서 뜻 보기</div>`}</button>
  <div class="vbtns"><button class="iconbtn" data-act="vprev" aria-label="이전 카드" ${vs.i?"":"disabled"}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button class="btn soft" data-act="vmark" data-v="2">다시 볼래요</button><button class="btn" data-act="vmark" data-v="1">외웠어요</button>
    <button class="iconbtn" data-act="vnext" aria-label="다음 카드"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button></div>
  <p class="kbd" style="text-align:center;margin-top:10px">Space 뒤집기 · ← → 넘기기 · 1 다시 볼래요 · 2 외웠어요</p>`;
  return h;
}
let tx=null;
document.addEventListener("touchstart",e=>{if(view==="vocab"&&e.target.closest("#vcard"))tx=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});
document.addEventListener("touchend",e=>{if(!tx)return;const dx=e.changedTouches[0].clientX-tx[0],dy=e.changedTouches[0].clientY-tx[1];tx=null;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){swiped=Date.now();vocabMove(dx<0?1:-1)}});
let swiped=0;

/* ---------- 이벤트 ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act;
  if(a==="exams"){view="exams";render();window.scrollTo(0,0)}
  else if(a==="exam")goExam(b.dataset.e);
  else if(a==="study"){view=store.cur?"home":"exams";render();window.scrollTo(0,0)}
  else if(a==="home"||a==="quit"){view="home";confirmReset=false;render();window.scrollTo(0,0)}
  else if(a==="wrong"){view="wrong";render();window.scrollTo(0,0)}
  else if(a==="add"){view="add";confirmDel=null;render();window.scrollTo(0,0)}
  else if(a==="theme"){theme=theme==="dark"?"light":"dark";try{localStorage.setItem(THEME_KEY,theme)}catch(e){}applyTheme()}
  else if(a==="start")start(b.dataset.e||cur,b.dataset.m,b.dataset.k?{k:b.dataset.k,c:b.dataset.c}:null);
  else if(a==="size"){size[b.dataset.m]=+b.dataset.v;render()}
  else if(a==="lv"){store.lv[cur]=b.dataset.v;save();render()}
  else if(a==="rd"){store.rd[cur]=!rdOn(cur);save();render()}
  else if(a==="pick")choose(+b.dataset.k);
  else if(a==="next")next();
  else if(a==="reset"){confirmReset=true;render()}
  else if(a==="reset-no"){confirmReset=false;render()}
  else if(a==="reset-yes"){idsOf(cur).forEach(id=>delete store.h[id]);store.s=store.s.filter(r=>(r.e||"toeic")!==cur);save();confirmReset=false;render()}
  else if(a==="vocab")openVocab("new");
  else if(a==="vflip"){if(Date.now()-swiped<400)return;vs.flip=!vs.flip;render()}
  else if(a==="vmark")vocabMark(+b.dataset.v);
  else if(a==="vprev")vocabMove(-1);
  else if(a==="vnext")vocabMove(1);
  else if(a==="vfilter"){vs.f=b.dataset.v;openVocab(vs.f)}
  else if(a==="vmix"){vs.mix=!vs.mix;openVocab()}
  else if(a==="vrestart")openVocab();
  else if(a==="tpl")downloadTemplate();
  else if(a==="csv-add")commitCSV();
  else if(a==="csv-cancel"){csv=null;render()}
  else if(a==="set-del"){confirmDel=b.dataset.id;render()}
  else if(a==="set-del-yes"){const id=b.dataset.id;custom.sets=custom.sets.filter(s=>s.id!==id);saveCustom();dropSet(id);confirmDel=null;render()}
});
document.addEventListener("change",e=>{if(e.target.id==="csvfile")handleFile(e.target.files[0])});
document.addEventListener("dragover",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.add("over")}});
document.addEventListener("dragleave",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d)d.classList.remove("over")});
document.addEventListener("drop",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();handleFile(e.dataTransfer.files[0])}});
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(view==="vocab"&&vs&&vs.i<vs.ids.length){
    if(e.key===" "){e.preventDefault();vs.flip=!vs.flip;render()}
    else if(e.key==="ArrowRight")vocabMove(1);else if(e.key==="ArrowLeft")vocabMove(-1);
    else if(e.key==="1")vocabMark(2);else if(e.key==="2")vocabMark(1);
    return;
  }
  if(view!=="quiz")return;
  const k=e.key.toUpperCase();
  if(sess.picked===null){let i="123456".indexOf(k);if(i<0)i=L.indexOf(k);if(i>=0&&k.length===1){e.preventDefault();choose(i)}}
  else if(e.key==="Enter"){e.preventDefault();next()}
});
applyTheme();render();
</script>
