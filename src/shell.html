<title>RC 완전정복</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F3F4F8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: phone-first app shell. Sticky top bar, one reading column, bottom tab bar on phones;
   answer choices drawn as OMR bubbles, the TOEIC answer-sheet mark. */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#F7F8FB; --ink:#141A2E; --muted:#636A84; --line:#E4E7EF;
  --brand:#C42F5C; --brand-soft:#FCEBF0; --on-brand:#FFFFFF;
  --teal:#0F7C74; --teal-soft:#E0F2EF; --indigo:#4448B8; --indigo-soft:#ECECFB; --amber:#9A5B08; --amber-soft:#FBF0DD;
  --ok:#1A7F53; --ok-soft:#E3F4EB; --bad:#C0392B; --bad-soft:#FCEAE7;
  --shadow:0 1px 2px rgba(20,26,46,.05),0 6px 20px rgba(20,26,46,.06);
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-item:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F121A; --surface:#181C27; --surface-2:#1E2330; --ink:#E8EAF2; --muted:#9BA2B8; --line:#2A3040;
  --brand:#F06A93; --brand-soft:#3B1D29; --on-brand:#1A0B11;
  --teal:#4CC5B9; --teal-soft:#14302D; --indigo:#A3A6FF; --indigo-soft:#23254A; --amber:#F0B35A; --amber-soft:#382A14;
  --ok:#52C890; --ok-soft:#15301F; --bad:#F28275; --bad-soft:#3A1D1A; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F121A; --surface:#181C27; --surface-2:#1E2330; --ink:#E8EAF2; --muted:#9BA2B8; --line:#2A3040;
  --brand:#F06A93; --brand-soft:#3B1D29; --on-brand:#1A0B11;
  --teal:#4CC5B9; --teal-soft:#14302D; --indigo:#A3A6FF; --indigo-soft:#23254A; --amber:#F0B35A; --amber-soft:#382A14;
  --ok:#52C890; --ok-soft:#15301F; --bad:#F28275; --bad-soft:#3A1D1A; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--safe-area-inset-top,env(safe-area-inset-top,0px));z-index:30;background:var(--bg)}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.gut{padding-left:max(16px,var(--safe-area-inset-left,env(safe-area-inset-left,0px)));padding-right:max(16px,var(--safe-area-inset-right,env(safe-area-inset-right,0px)))}
.col{max-width:720px;margin:0 auto}

/* top bar */
.topbar{position:sticky;top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .col{display:flex;align-items:center;gap:12px;height:56px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.01em;background:none;border:0;padding:0;cursor:pointer}
.logo i{width:22px;height:22px;border-radius:50%;border:2px solid var(--brand);display:grid;place-items:center}
.logo i::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--brand)}
.spacer{flex:1}
.tabs{display:flex;gap:4px}
.tab{display:flex;align-items:center;gap:6px;background:none;border:0;padding:8px 12px;border-radius:10px;color:var(--muted);font-size:14px;font-weight:500;cursor:pointer;position:relative}
.tab[aria-current="true"]{color:var(--ink);background:var(--surface)}
.tab svg{width:20px;height:20px}
.tab .dot{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--brand);color:var(--on-brand);font-family:var(--f-num);font-size:11px;display:grid;place-items:center}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn svg{width:18px;height:18px}

main{padding-block:20px 40px}
@media (max-width:639px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px max(16px,var(--safe-area-inset-right,env(safe-area-inset-right,0px))) calc(6px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))) max(16px,var(--safe-area-inset-left,env(safe-area-inset-left,0px)))}
  .tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 18px;flex:1;max-width:160px}
  .tab[aria-current="true"]{background:none;color:var(--brand)}
  .tab .dot{position:absolute;top:2px;left:calc(50% + 6px)}
  body.has-tabs main{padding-bottom:calc(96px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)))}
  body.in-quiz .tabs{display:none}
}
@media (min-width:640px){.tab svg{display:none}}

/* type */
h1{font-size:26px;line-height:1.25;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:17px;line-height:1.35;margin:0;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{font-family:var(--f-num);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.stack{display:grid;gap:12px}
.section{margin-top:32px;display:grid;gap:12px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}

/* home */
.hero{display:grid;gap:6px;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.stat b{display:block;font-family:var(--f-num);font-size:22px;font-weight:600;line-height:1.2}
.stat b small{font-size:13px;color:var(--muted);font-weight:500}
.stat span{font-size:12.5px;color:var(--muted)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,46,.12)}
.lvhint{font-size:12.5px;color:var(--muted)}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.badge{grid-row:1/span 3;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-num);font-weight:600;font-size:13px;line-height:1.1;text-align:center}
.b-g{background:var(--brand-soft);color:var(--brand)}
.b-v{background:var(--teal-soft);color:var(--teal)}
.b-r{background:var(--indigo-soft);color:var(--indigo)}
.b-m{background:var(--amber-soft);color:var(--amber)}
.b-6{background:var(--indigo-soft);color:var(--brand)}
.b-w{background:var(--teal-soft);color:var(--indigo)}
.gap.num{min-width:3.2em;text-align:center;font-family:var(--f-num);font-size:12px;font-weight:600;line-height:1.1em;color:var(--muted)}
.gap.num.on{color:var(--brand)}
.passage .ptext{white-space:pre-line}
.stem p.word,.word{font-family:var(--f-item);font-size:30px;font-weight:600;line-height:1.2;margin:0}
.ex{font-family:var(--f-item);font-size:16px}
.weak{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.mode .desc{font-size:13.5px;color:var(--muted);min-width:0}
.mode .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.mode .meta b{font-family:var(--f-num);color:var(--ink);font-weight:600}
.mode .go{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.chips{display:flex;gap:6px}
.chips button{font-family:var(--f-num);font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--surface-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14.5px;font-weight:600;padding:10px 18px;min-height:44px;border-radius:12px;border:1px solid var(--brand);background:var(--brand);color:var(--on-brand);cursor:pointer}
.btn.soft{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.btn.plain{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.recent{list-style:none;margin:0;padding:0}
.recent li{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.recent li:last-child{border-bottom:0}
.pct{font-family:var(--f-num);font-weight:600;min-width:3.2em;text-align:right}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;color:var(--muted);text-align:center;font-size:14px}

/* quiz */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qhead .title{font-weight:600;font-size:14px}
.timer{font-family:var(--f-num);font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.timer.over{color:var(--bad);border-color:var(--bad)}
.count{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:20px}
.progress i{display:block;height:100%;background:var(--brand);border-radius:3px;transition:width .3s}
.passage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 18px 20px;margin-bottom:22px}
.ptype{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-num);font-size:11.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.passage h3{font-family:var(--f-item);font-size:19px;line-height:1.35;margin:0 0 10px;font-weight:600}
.passage p{font-family:var(--f-item);font-size:16.5px;line-height:1.78;margin:0}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.tag.tcat{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.lv2{color:var(--teal)!important}.lv3{color:var(--amber)!important}.lv4{color:var(--bad)!important}
.stem{display:flex;gap:10px;margin:12px 0 18px}
.stem .qn{font-family:var(--f-num);color:var(--muted);padding-top:3px;flex:none;font-size:15px}
.stem p{font-family:var(--f-item);font-size:19px;line-height:1.6;margin:0;min-width:0}
.gap{display:inline-block;min-width:5.5em;border-bottom:2px solid currentColor;margin:0 .15em;height:1.1em;vertical-align:-.15em}
.gap.on{border-color:var(--brand);background:var(--brand-soft)}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;font-family:var(--f-item);font-size:17px;line-height:1.4;transition:border-color .15s,background .15s}
@media (hover:hover){.choice:hover:not(:disabled){border-color:var(--brand)}}
.choice:active:not(:disabled){transform:scale(.99)}
.choice:disabled{cursor:default}
.choice span:last-child{min-width:0}
.bub{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--brand);color:var(--brand);display:grid;place-items:center;font-family:var(--f-num);font-size:13px;font-weight:600}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.right .bub{border-color:var(--ok);background:var(--ok);color:var(--surface)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .bub{border-color:var(--bad);background:var(--bad);color:var(--surface)}
.choice.dim{opacity:.55}
.fb{margin-top:18px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.fb .verdict{padding:12px 16px;font-weight:700;display:flex;align-items:center;gap:8px}
.fb .verdict.ok{background:var(--ok-soft);color:var(--ok)}
.fb .verdict.no{background:var(--bad-soft);color:var(--bad)}
.fb dl{margin:0;padding:14px 16px 16px;display:grid;gap:12px}
.fb dt{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin-bottom:2px}
.fb dd{margin:0;font-size:14.5px;line-height:1.7}
.actionbar{position:sticky;bottom:0;z-index:10;margin-top:18px;padding:12px 0 calc(12px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.actionbar .inner{display:flex;align-items:center;gap:12px}
.kbd{font-family:var(--f-num);font-size:12px;color:var(--muted)}
@media (max-width:639px){.kbd{display:none}.actionbar .btn{flex:1}}

/* results */
.scorecard{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:108px;height:108px}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--brand);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring text{fill:var(--ink);font-family:var(--f-num);font-weight:600}
.cats{display:grid;gap:10px}
.cat{display:grid;grid-template-columns:7.5em 1fr 3.2em;gap:10px;align-items:center;font-size:14px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--ok)}
.bar i.mid{background:var(--amber)}.bar i.low{background:var(--bad)}
.review{list-style:none;margin:0;padding:0}
.review li{border-bottom:1px solid var(--line)}
.review li:last-child{border-bottom:0}
.review details{padding:12px 0}
.review summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;list-style:none}
.review summary::-webkit-details-marker{display:none}
.mark{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;align-self:flex-start;margin-top:2px}
.mark.ok{background:var(--ok-soft);color:var(--ok)}.mark.no{background:var(--bad-soft);color:var(--bad)}
.review .s{font-family:var(--f-item);font-size:15.5px;min-width:0}
.review .body{padding:10px 0 2px 32px;font-size:14px;display:grid;gap:6px;line-height:1.7}
.confirm{display:inline-flex;gap:8px;align-items:center;font-size:13px;flex-wrap:wrap}
@media (max-width:420px){
  h1{font-size:23px}
  .stat b{font-size:19px}
  .stem p{font-size:18px}
  .cat{grid-template-columns:6em 1fr 3em}
  .ring{width:92px;height:92px}
}
@media (prefers-reduced-motion:reduce){.progress i,.choice{transition:none}}
</style>

<header class="topbar gut">
  <div class="col">
    <button class="logo" data-act="home" aria-label="홈으로"><i></i>RC 완전정복</button>
    <span class="spacer"></span>
    <nav class="tabs" id="tabs">
      <button class="tab" id="tab-home" data-act="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>학습</button>
      <button class="tab" id="tab-wrong" data-act="wrong"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12l6 6M15 12l-6 6"/></svg>오답노트<span class="dot" id="wrong-dot" hidden></span></button>
    </nav>
    <button class="iconbtn" id="theme-btn" data-act="theme" aria-label="다크 모드로 바꾸기"></button>
  </div>
</header>
<main class="gut"><div class="col" id="app"></div></main>

</script>
<script>
const KIND_LABEL={main:"주제 확인",fact:"사실 확인",blank:"빈칸 추론"};
const KIND_NAME={G:"Part 5 문법",V:"Part 5 어휘",P6:"Part 6 장문 빈칸",R:"Part 7 독해",W:"단어 퀴즈"};
const LV_LABEL={2:"중상",3:"상",4:"최상"};
const MODE_LABEL={G:"Part 5 문법",V:"Part 5 어휘",P6:"Part 6 장문 빈칸",R:"Part 7 독해",W:"단어 퀴즈",MIX:"실전 믹스",WRONG:"오답 다시 풀기",CAT:"약한 유형 집중"};

/* 정답은 데이터에서 항상 첫 번째 선택지이고, 출제할 때 섞는다. */
const BANK={};
G.forEach(r=>BANK[r[0]]={id:r[0],kind:"G",cat:r[1],lv:r[2],q:r[3],c:r[4],ko:r[5],ex:r[6]});
V.forEach(r=>BANK[r[0]]={id:r[0],kind:"V",cat:r[1],lv:r[2],q:r[3],c:r[4],ko:r[5],ex:r[6]});
R.forEach(p=>p.qs.forEach((r,i)=>BANK[p.id+"-"+i]={id:p.id+"-"+i,kind:"R",cat:KIND_LABEL[r[0]],qk:r[0],lv:p.lv,q:r[1],c:r[2],ex:r[3],p}));
P6.forEach(p=>p.qs.forEach((r,i)=>BANK[p.id+"-"+i]={id:p.id+"-"+i,kind:"P6",cat:r[0],lv:p.lv,q:"빈칸 ("+(i+1)+")",bi:i+1,c:r[1],ex:r[2],p}));
/* 단어 퀴즈 오답 선택지: 같은 품사의 다른 뜻 3개를 고정으로 고른다(다시 풀 때도 같은 문제). */
(()=>{const by={};W.forEach(r=>(by[r[1]]=by[r[1]]||[]).push(r));
  W.forEach(r=>{const g=by[r[1]].length>=4?by[r[1]]:W,i=g.indexOf(r),d=[];
    for(const step of [7,19,37,53,71,89,3,11]){if(d.length===3)break;const o=g[((i<0?0:i)+step)%g.length];if(o!==r&&o[3]!==r[3]&&!d.includes(o[3]))d.push(o[3])}
    BANK[r[0]]={id:r[0],kind:"W",cat:r[1],lv:3,q:r[2],c:[r[3],...d],wex:r[4],wko:r[5]}});})();
const ALL=Object.keys(BANK);

/* ---------- 저장 (이 브라우저에만) ---------- */
const KEY="toeic-rc-v1";
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.h)return s}catch(e){}return {h:{},s:[]}}
let store=load();
if(!store.lv)store.lv=2;
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function stat(ids){let seen=0,n=0,c=0;ids.forEach(id=>{const h=store.h[id];if(h){seen++;n+=h.n;c+=h.c}});return {seen,total:ids.length,acc:n?Math.round(c/n*100):null}}
function wrongIds(){return Object.keys(store.h).filter(id=>BANK[id]&&store.h[id].last===0)}

/* ---------- 테마: 기본은 라이트 ---------- */
const THEME_KEY="toeic-rc-theme";
let theme="light";try{theme=localStorage.getItem(THEME_KEY)||"light"}catch(e){}
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
function applyTheme(){
  document.documentElement.setAttribute("data-theme",theme);
  const b=document.getElementById("theme-btn");
  b.innerHTML=theme==="dark"?SUN:MOON;
  b.setAttribute("aria-label",theme==="dark"?"라이트 모드로 바꾸기":"다크 모드로 바꾸기");
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=theme==="dark"?"#0F121A":"#F3F4F8";
}

/* ---------- 출제 ---------- */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const tries=id=>(store.h[id]?store.h[id].n:0);
const poolG=()=>G.filter(r=>r[2]>=store.lv).map(r=>r[0]);
const poolV=()=>V.filter(r=>r[2]>=store.lv).map(r=>r[0]);
const poolR=()=>R.filter(p=>p.lv>=store.lv);
const poolP6=()=>P6.filter(p=>p.lv>=store.lv);
const poolW=()=>W.map(r=>r[0]);
const pIds=p=>p.qs.map((_,i)=>p.id+"-"+i);
const isSet=k=>k==="R"||k==="P6";
function pickLeast(ids,n){return ids.map(id=>[id,tries(id)+Math.random()*.9]).sort((a,b)=>a[1]-b[1]).slice(0,n).map(x=>x[0])}
function pickPassages(n,pool=poolR()){return pool.map(p=>[p,pIds(p).reduce((s,id)=>s+tries(id),0)/p.qs.length+Math.random()*.9]).sort((a,b)=>a[1]-b[1]).slice(0,n).map(x=>x[0])}
const size={G:10,V:10,P6:1,R:2,W:10};

function build(mode,opt){
  let ids=[];
  if(mode==="CAT"){const pool=opt.k==="G"?poolG():opt.k==="V"?poolV():poolW();ids=pickLeast(pool.filter(id=>BANK[id].cat===opt.c),10)}
  if(mode==="P6")pickPassages(size.P6,poolP6()).forEach(p=>ids.push(...pIds(p)));
  if(mode==="W")ids=pickLeast(poolW(),size.W);
  if(mode==="G")ids=pickLeast(poolG(),size.G);
  if(mode==="V")ids=pickLeast(poolV(),size.V);
  if(mode==="R")pickPassages(size.R).forEach(p=>ids.push(...pIds(p)));
  if(mode==="MIX"){ids=shuffle([...pickLeast(poolG(),4),...pickLeast(poolV(),4)]);const q=pickPassages(1,poolP6())[0];if(q)ids.push(...pIds(q));const p=pickPassages(1)[0];if(p)ids.push(...pIds(p))}
  if(mode==="WRONG"){
    const w=wrongIds();
    ids=shuffle(w.filter(id=>!isSet(BANK[id].kind)));
    [...new Set(w.filter(id=>isSet(BANK[id].kind)).map(id=>BANK[id].p.id))].forEach(pid=>ids.push(...w.filter(id=>BANK[id].p&&BANK[id].p.id===pid).sort()));
  }
  return ids.map(id=>({id,order:shuffle([0,1,2,3])}));
}

/* ---------- 상태 ---------- */
let view="home",sess=null,timer=null,confirmReset=false;
const app=document.getElementById("app");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const blankify=(s,on)=>esc(s).replace("-------",`<span class="gap${on?" on":""}" aria-label="빈칸"></span>`);
const L="ABCD";
const lvTag=lv=>`<span class="tag lv${lv}">${LV_LABEL[lv]}</span>`;

function start(mode,opt){
  const items=build(mode,opt);if(!items.length)return;
  const label=mode==="CAT"?opt.c+" 집중":MODE_LABEL[mode];
  sess={mode,opt,label,items,i:0,res:[],picked:null,t0:Date.now()};
  view="quiz";render();window.scrollTo(0,0);
}
function choose(k){
  if(!sess||sess.picked!==null)return;
  const it=sess.items[sess.i],real=it.order[k],ok=real===0;
  sess.picked=k;
  sess.res.push({id:it.id,ok,pick:real,ms:Date.now()-sess.t0});
  const h=store.h[it.id]||{n:0,c:0,last:0};h.n++;if(ok)h.c++;h.last=ok?1:0;store.h[it.id]=h;save();
  stopTimer();render();
  const fb=document.getElementById("fb");
  if(fb)fb.scrollIntoView({block:"nearest",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});
}
function next(){
  if(!sess||sess.picked===null)return;
  if(sess.i<sess.items.length-1){
    const prevP=BANK[sess.items[sess.i].id].p;
    sess.i++;sess.picked=null;sess.t0=Date.now();render();
    const curP=BANK[sess.items[sess.i].id].p;
    if(!curP||curP!==prevP)window.scrollTo(0,0);
    else{const st=document.getElementById("stem");if(st)st.scrollIntoView({block:"start"})}
  }else{
    const ok=sess.res.filter(r=>r.ok).length;
    store.s.unshift({m:sess.mode,lab:sess.label,ok,n:sess.res.length,d:Date.now()});store.s=store.s.slice(0,30);save();
    view="result";render();window.scrollTo(0,0);
  }
}
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
function startTimer(limit){
  stopTimer();const el=document.getElementById("timer");if(!el)return;
  const tick=()=>{const s=Math.floor((Date.now()-sess.t0)/1000);el.textContent=s+"s / "+limit+"s";el.classList.toggle("over",s>limit)};
  tick();timer=setInterval(tick,1000);
}

/* ---------- 화면 ---------- */
function render(){
  document.getElementById("tab-home").setAttribute("aria-current",view!=="wrong");
  document.getElementById("tab-wrong").setAttribute("aria-current",view==="wrong");
  document.body.classList.toggle("in-quiz",view==="quiz");
  document.body.classList.toggle("has-tabs",view!=="quiz");
  const w=wrongIds().length,dot=document.getElementById("wrong-dot");dot.hidden=!w;dot.textContent=w;
  if(view!=="quiz")stopTimer();
  if(view==="home")app.innerHTML=homeView();
  if(view==="quiz"){app.innerHTML=quizView();if(sess.picked===null)startTimer({R:60,P6:30,W:10}[BANK[sess.items[sess.i].id].kind]||20)}
  if(view==="result")app.innerHTML=resultView();
  if(view==="wrong")app.innerHTML=wrongView();
}
function chips(m,opts){return `<div class="chips" role="group" aria-label="문항 수">${opts.map(([v,l])=>`<button data-act="size" data-m="${m}" data-v="${v}" aria-pressed="${size[m]===v}">${l}</button>`).join("")}</div>`}
function meta(ids){const s=stat(ids);return `<div class="meta"><span>푼 문항 <b>${s.seen}/${s.total}</b></span><span>정답률 <b>${s.acc===null?"–":s.acc+"%"}</b></span></div>`}

function quizView(){
  const it=sess.items[sess.i],q=BANK[it.id],done=sess.picked!==null,r=done?sess.res[sess.res.length-1]:null,n=sess.items.length;
  const isR=q.kind==="R",isP6=q.kind==="P6",isW=q.kind==="W",qi=q.p?+it.id.slice(-1):0;
  const qnum=isP6?131+sess.items.slice(0,sess.i).filter(x=>BANK[x.id].kind==="P6").length:isR?147+sess.items.slice(0,sess.i).filter(x=>BANK[x.id].kind==="R").length:101+sess.i;
  let h=`<div class="qhead"><button class="iconbtn" data-act="quit" aria-label="그만두고 홈으로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <span class="title">${esc(sess.label)}</span><span class="spacer"></span>
    <span id="timer" class="timer">${done?Math.round(r.ms/1000)+"s":""}</span><span class="count">${sess.i+1}/${n}</span></div>
  <div class="progress"><i style="width:${(sess.i+(done?1:0))/n*100}%"></i></div>`;
  if(isR)h+=`<article class="passage"><div class="ptype"><span>${esc(q.p.type)}</span><span>Questions ${qnum-qi}–${qnum-qi+2}</span></div><h3>${esc(q.p.title)}</h3><p>${blankify(q.p.text,q.qk==="blank")}</p></article>`;
  if(isP6){const base=qnum-qi;h+=`<article class="passage"><div class="ptype"><span>${esc(q.p.type)}</span><span>Questions ${base}–${base+3}</span></div><h3>${esc(q.p.title)}</h3><p class="ptext">${esc(q.p.text).replace(/\{(\d)\}/g,(m,d)=>`<span class="gap num${+d===q.bi?" on":""}" aria-label="빈칸 ${base+ +d-1}">${base+ +d-1}</span>`)}</p></article>`}
  h+=`<div id="stem" class="tags"><span class="tag tcat">${esc(q.cat)}</span>${isW?"":lvTag(q.lv)}</div>
  ${isW?`<div class="stem" style="flex-direction:column;gap:4px"><p class="word" lang="en">${esc(q.q)}</p><p class="muted small" style="margin:0">알맞은 뜻을 고르세요</p></div>`
   :`<div class="stem"><span class="qn">${qnum}.</span><p>${isR?esc(q.q):isP6?`빈칸 ${qnum}에 들어갈 가장 알맞은 ${q.cat==="문장 삽입"?"문장":"말"}을 고르세요.`:blankify(q.q,false)}</p></div>`}
  <div class="choices">${it.order.map((real,k)=>{
    let cls="";if(done){cls=real===0?"right":k===sess.picked?"wrong":"dim"}
    return `<button class="choice ${cls}" data-act="pick" data-k="${k}" ${done?"disabled":""}><span class="bub">${L[k]}</span><span${isW?' style="font-family:var(--f-ui);font-size:16px"':""}>${esc(q.c[real])}</span></button>`}).join("")}</div>`;
  if(done){
    const right=L[it.order.indexOf(0)];
    h+=`<div class="fb" id="fb"><div class="verdict ${r.ok?"ok":"no"}">${r.ok?"정답이에요":"오답이에요 · 정답 ("+right+")"}</div><dl>
      ${q.ko?`<div><dt>해석</dt><dd>${esc(q.ko)}</dd></div>`:""}
      ${q.p&&qi===0?`<div><dt>지문 요지</dt><dd>${esc(q.p.ko)}</dd></div>`:""}
      ${isW?`<div><dt>예문</dt><dd><span class="ex" lang="en">${esc(q.wex)}</span><br><span class="muted">${esc(q.wko)}</span></dd></div>`:""}
      ${q.ex?`<div><dt>해설</dt><dd>${esc(q.ex)}</dd></div>`:""}</dl></div>
    <div class="actionbar"><div class="inner"><span class="kbd">Enter 다음</span><span class="spacer"></span><button class="btn" data-act="next">${sess.i<n-1?"다음 문제":"결과 보기"}</button></div></div>`;
  }else h+=`<p class="kbd" style="margin-top:14px">키보드 1–4 또는 A–D로도 고를 수 있어요</p>`;
  return h;
}
function ring(p){const R=44,C=2*Math.PI*R;return `<svg class="ring" viewBox="0 0 108 108" role="img" aria-label="정답률 ${p}%"><circle class="bg" cx="54" cy="54" r="${R}"/><circle class="fg" cx="54" cy="54" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/100)}"/><text x="54" y="61" text-anchor="middle" font-size="22">${p}%</text></svg>`}
function catBreakdown(res){
  const m={};res.forEach(r=>{const c=BANK[r.id].cat;(m[c]=m[c]||{n:0,c:0}).n++;if(r.ok)m[c].c++});
  return Object.entries(m).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n).map(([c,v])=>{const p=v.c/v.n;return `<div class="cat"><span>${esc(c)}</span><div class="bar"><i class="${p<.5?"low":p<.8?"mid":""}" style="width:${Math.max(p*100,2)}%"></i></div><span class="num">${v.c}/${v.n}</span></div>`}).join("");
}
function reviewList(list){
  return `<ul class="review">${list.map(({id,ok,pick})=>{const q=BANK[id];
    return `<li><details><summary><span class="mark ${ok?"ok":"no"}">${ok?"O":"X"}</span><span class="s">${q.p?`${esc(q.p.title)} <span class="muted small">· ${q.kind==="P6"?"빈칸 "+q.bi+" · ":""}${esc(q.cat)}</span>`:q.kind==="W"?`<b lang="en">${esc(q.q)}</b> <span class="muted small">· ${esc(q.cat)}</span>`:blankify(q.q,false)}</span></summary>
    <div class="body"><div class="tags"><span class="tag tcat">${esc(q.cat)}</span>${q.kind==="W"?"":lvTag(q.lv)}</div>${q.kind==="R"?`<div class="muted">${esc(q.q)}</div>`:""}${q.kind==="P6"?`<div class="muted">${esc(q.p.text.split(/(\{\d\})/).map(t=>t==="{"+q.bi+"}"?"[ ? ]":/^\{\d\}$/.test(t)?"___":t).join("").split(/(?<=[.!?])\s+/).find(x=>x.includes("[ ? ]"))||"")}</div>`:""}<div>정답: <b>${esc(q.c[0])}</b>${!ok&&pick!=null?` <span class="muted">· 고른 답: ${esc(q.c[pick])}</span>`:""}</div>${q.ko?`<div class="muted">${esc(q.ko)}</div>`:""}${q.wex?`<div><span class="ex" lang="en">${esc(q.wex)}</span><br><span class="muted">${esc(q.wko)}</span></div>`:""}${q.ex?`<div>${esc(q.ex)}</div>`:""}</div></details></li>`}).join("")}</ul>`;
}
function resultView(){
  const res=sess.res,ok=res.filter(r=>r.ok).length,n=res.length,pct=Math.round(ok/n*100);
  const avg=Math.round(res.reduce((s,r)=>s+r.ms,0)/n/1000),hasWrong=res.some(r=>!r.ok);
  const msg=pct>=90?"이 난이도는 거의 완성됐어요.":pct>=70?"좋아요. 틀린 유형만 다시 보면 돼요.":"해설을 읽고 오답을 한 번 더 풀어 보세요.";
  /* 이번 세트에서 가장 약한 Part 5 문법·어휘 유형(정답률 80% 미만)을 골라 바로 집중 연습 */
  const cm={};res.forEach(r=>{const q=BANK[r.id];if(q.kind!=="G"&&q.kind!=="V")return;const k=q.kind+"|"+q.cat;(cm[k]=cm[k]||{n:0,c:0}).n++;if(r.ok)cm[k].c++});
  const weak=Object.entries(cm).filter(([k,v])=>v.c/v.n<.8).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n)[0];
  const wk=weak&&weak[0].split("|"),wn=wk?(wk[0]==="G"?poolG():poolV()).filter(id=>BANK[id].cat===wk[1]).length:0;
  return `<span class="eyebrow">${esc(sess.label)} 결과</span>
  <div class="panel" style="margin-top:10px"><div class="scorecard">${ring(pct)}<div><div class="num" style="font-size:28px;font-weight:600">${ok} / ${n}</div><div class="muted small">문항당 평균 ${avg}초</div><div style="margin-top:6px">${msg}</div></div></div></div>
  <div class="row" style="margin-top:14px">
    <button class="btn" data-act="start" data-m="${sess.mode}"${sess.opt?` data-k="${sess.opt.k}" data-c="${esc(sess.opt.c)}"`:""}>${sess.mode==="WRONG"?"남은 오답 다시 풀기":"새 세트 풀기"}</button>
    ${hasWrong&&sess.mode!=="WRONG"?`<button class="btn soft" data-act="start" data-m="WRONG">오답만 다시 풀기</button>`:""}
    <button class="btn plain" data-act="home">홈으로</button>
  </div>
  <div class="section"><h2>유형별 정답</h2><div class="panel cats">${catBreakdown(res)}${wk&&wn>1?`<div class="weak"><span class="small">가장 약한 유형: <b>${esc(wk[1])}</b> <span class="muted">(${KIND_NAME[wk[0]]} ${wn}문항)</span></span><button class="btn soft" data-act="start" data-m="CAT" data-k="${wk[0]}" data-c="${esc(wk[1])}" style="min-height:38px;padding:6px 14px;font-size:13.5px">이 유형만 풀기</button></div>`:""}</div></div>
  <div class="section"><h2>문항 다시 보기</h2><div class="panel" style="padding:4px 16px">${reviewList(res)}</div></div>`;
}
function wrongView(){
  const w=wrongIds();
  if(!w.length)return `<div class="hero"><span class="eyebrow">오답노트</span><h1>틀린 문제가 없어요</h1></div><div class="empty">세트를 풀다가 틀린 문제는 여기에 모여요.<br>다시 풀어서 맞히면 자동으로 빠져요.<div style="margin-top:14px"><button class="btn" data-act="home">세트 고르러 가기</button></div></div>`;
  const gr={G:[],V:[],P6:[],R:[],W:[]};w.forEach(id=>gr[BANK[id].kind].push(id));
  const block=(k,t)=>gr[k].length?`<div class="section"><div class="section-head"><h2>${t}</h2><span class="num muted small">${gr[k].length}</span></div><div class="panel" style="padding:4px 16px">${reviewList(gr[k].map(id=>({id,ok:false,pick:null})))}</div></div>`:"";
  return `<div class="hero"><span class="eyebrow">오답노트</span><h1>다시 볼 문제 ${w.length}개</h1><p class="muted" style="margin:0">마지막으로 풀었을 때 틀린 문제예요. 눌러서 정답과 해설을 확인하세요.</p></div>
  <button class="btn" data-act="start" data-m="WRONG">오답 다시 풀기</button>
  ${Object.keys(gr).map(k=>block(k,KIND_NAME[k])).join("")}`;
}

/* ---------- 이벤트 ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act;
  if(a==="home"||a==="quit"){view="home";confirmReset=false;render();window.scrollTo(0,0)}
  else if(a==="wrong"){view="wrong";render();window.scrollTo(0,0)}
  else if(a==="theme"){theme=theme==="dark"?"light":"dark";try{localStorage.setItem(THEME_KEY,theme)}catch(e){}applyTheme()}
  else if(a==="start")start(b.dataset.m,b.dataset.k?{k:b.dataset.k,c:b.dataset.c}:null);
  else if(a==="size"){size[b.dataset.m]=+b.dataset.v;render()}
  else if(a==="lv"){store.lv=+b.dataset.v;save();render()}
  else if(a==="pick")choose(+b.dataset.k);
  else if(a==="next")next();
  else if(a==="reset"){confirmReset=true;render()}
  else if(a==="reset-no"){confirmReset=false;render()}
  else if(a==="reset-yes"){store={h:{},s:[],lv:store.lv};save();confirmReset=false;render()}
});
document.addEventListener("keydown",e=>{
  if(view!=="quiz"||e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toUpperCase();
  if(sess.picked===null){let i="1234".indexOf(k);if(i<0)i="ABCD".indexOf(k);if(i>=0&&k.length===1){e.preventDefault();choose(i)}}
  else if(e.key==="Enter"){e.preventDefault();next()}
});
applyTheme();render();
</script>
